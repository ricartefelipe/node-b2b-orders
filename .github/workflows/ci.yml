name: ci

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: npm audit (falha se HIGH/CRITICAL)
        run: npm audit --audit-level=high

      - name: Validate OpenAPI spec exists
        run: |
          test -f docs/api/openapi.json && echo "OpenAPI JSON present"
          test -f docs/api/openapi.yaml && echo "OpenAPI YAML present"

  e2e:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: orders_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/orders_test

      - name: Seed database
        run: npx prisma db seed
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/orders_test

      - name: E2E tests
        run: npm run test:e2e
        timeout-minutes: 5
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/orders_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: e2e-test-secret-key-do-not-use-in-production
          RABBITMQ_URL: amqp://guest:guest@localhost:5672

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # Imagens finais: construídas e escaneadas ANTES de qualquer publicação. O job de publicação só
  # existe em push para develop/master e depende explicitamente dos gates deste mesmo SHA
  # (build, e2e, security e image-scan); se qualquer um falhar ou ficar pendente, não publica.
  image-scan:
    runs-on: ubuntu-latest
    needs: [build, e2e, security]
    strategy:
      matrix:
        include:
          - target: api
            dockerfile: docker/api.Dockerfile
          - target: worker
            dockerfile: docker/worker.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (${{ matrix.target }}, linux/amd64, sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          platforms: linux/amd64
          tags: node-b2b-orders-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan da imagem final (HIGH/CRITICAL bloqueia; sem ignore-unfixed)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: node-b2b-orders-${{ matrix.target }}:${{ github.sha }}
          scanners: vuln
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          exit-code: '1'

  publish:
    # Só push (nunca pull_request: código de PR não recebe credenciais de publicação).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    needs: [build, e2e, security, image-scan]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    strategy:
      matrix:
        include:
          - target: api
            dockerfile: docker/api.Dockerfile
            suffix: ""
          - target: worker
            dockerfile: docker/worker.Dockerfile
            suffix: "-worker"
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # A tag `<sha>` e o rótulo org.opencontainers.image.revision ligam a imagem ao SHA validado.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (${{ matrix.target }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
